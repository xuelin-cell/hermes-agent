<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元景数字员工 登录</title>
<style>
/* Login presentation follows apps/desktop/src/app/login/login.css and the UniWork theme.
   Assets are inlined because the application bundle requires authentication. */
  :root { color-scheme: light; --dt-background: #fff; --dt-card: #fff; --dt-foreground: #101219; --dt-border: #e6e9ed; --dt-muted: #f0f0f0; --dt-primary: #f5765a; --dt-primary-solid: #934736; --dt-primary-solid-foreground: #fcfcfc; --dt-destructive: #c52b20; --theme-accent-soft: #feeeea; --ui-text-secondary: #32374a; --ui-text-tertiary: #686f82; --ui-text-quaternary: #868d9c; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --dt-background: #17181c; --dt-card: #202126; --dt-foreground: #edeef2; --dt-border: #363941; --dt-muted: #282a30; --dt-destructive: #f38d83; --theme-accent-soft: #422b28; --ui-text-secondary: #d8dbe4; --ui-text-tertiary: #a5aaba; --ui-text-quaternary: #858b9c; }
    .login-logo { filter: brightness(0) invert(1); }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; background: var(--dt-background); }
  body { color: var(--dt-foreground); font: 14px/1.5 "DFPKingGothicGB-Regular", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
  button, input { font: inherit; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
/* 与 hexagent 登录页保持同一套轻量表单视觉，账号恢复和提交逻辑仍由桌面主进程负责。 */
.login-container {
  display: flex;
  min-height: 100%;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  background: var(--dt-background);
  animation: login-fade-in-up 0.6s ease-out;
}

@keyframes login-fade-in-up {
  from {
    opacity: 0;
    transform: translateY(24px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.login-card {
  width: 100%;
  max-width: 400px;
  padding: 40px 32px;
  background: transparent;
}

.login-header {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
}

.login-logo {
  width: 100%;
  max-width: 390px;
  height: auto;
  object-fit: contain;
}

.login-loader {
  margin: 36px auto;
}

.login-field {
  margin-bottom: 16px;
}

.login-input-group {
  display: flex;
  align-items: stretch;
  overflow: hidden;
  background: var(--dt-card);
  border: 1px solid var(--dt-border);
  border-radius: 8px;
}

.login-input-group:focus-within {
  border-color: var(--dt-primary);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--dt-primary) 15%, transparent);
}

.login-addon {
  display: flex;
  align-items: center;
  padding: 0 12px;
  color: var(--ui-text-secondary);
  font-size: 14px;
  white-space: nowrap;
  user-select: none;
  background: var(--dt-background);
  border-right: 1px solid var(--dt-border);
}

.login-input {
  min-width: 0;
  flex: 1;
  padding: 10px 12px;
  color: var(--dt-foreground);
  font-size: 14px;
  background: transparent;
  border: 0;
  outline: 0;
}

.login-input::placeholder {
  color: var(--ui-text-quaternary);
}

.login-input:disabled {
  cursor: not-allowed;
  opacity: 0.65;
}

.login-captcha-img {
  display: flex;
  width: 80px;
  min-height: 40px;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  padding: 0;
  overflow: hidden;
  color: var(--ui-text-quaternary);
  font-size: 11px;
  background: var(--dt-muted);
  border: 0;
  border-left: 1px solid var(--dt-border);
  cursor: pointer;
}

.login-captcha-img img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.login-captcha-img:disabled {
  cursor: not-allowed;
}

.login-send-btn {
  width: 112px;
  flex-shrink: 0;
  padding: 0 8px;
  color: var(--dt-primary);
  font-size: 13px;
  white-space: nowrap;
  background: var(--dt-card);
  border: 0;
  border-left: 1px solid var(--dt-border);
  cursor: pointer;
}

.login-send-btn:hover:not(:disabled) {
  background: var(--theme-accent-soft);
}

.login-send-btn:disabled {
  color: var(--ui-text-quaternary);
  cursor: not-allowed;
}

.login-error,
.login-field-error,
.login-field-status,
.login-unavailable {
  color: var(--dt-destructive);
  font-size: 14px;
  text-align: center;
}

.login-error {
  min-height: 21px;
  margin: -4px 0 12px;
}

.login-field-error,
.login-field-status {
  margin-top: 8px;
}

.login-field-status,
.login-unavailable {
  color: var(--ui-text-tertiary);
}

.login-unavailable {
  margin-top: 12px;
}

.login-btn {
  display: flex;
  width: 100%;
  height: 44px;
  align-items: center;
  justify-content: center;
  color: var(--dt-primary-solid-foreground);
  font-size: 14px;
  font-weight: 500;
  background: var(--dt-primary-solid);
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}

.login-btn:hover:not(:disabled) {
  background: color-mix(in srgb, var(--dt-primary-solid) 85%, black);
}

.login-btn:disabled {
  background: color-mix(in srgb, var(--dt-primary-solid) 40%, var(--dt-card));
  cursor: not-allowed;
}

.login-input-group:focus-within,
.login-btn:focus-visible,
.login-send-btn:focus-visible,
.login-captcha-img:focus-visible {
  outline: 2px solid var(--dt-primary);
  outline-offset: 2px;
}

/* 登录标识为透明底黑色字标，暗色背景下使用反白保持辨识度。 */
:root[data-hermes-theme='uniwork'].dark .login-logo {
  filter: brightness(0) invert(1);
}

  .login-container { min-height: 100vh; min-height: 100dvh; }
  #notice[hidden] { display: block !important; visibility: hidden; }
  .login-error.info { color: var(--ui-text-tertiary); }
  .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dev { margin-top: 24px; color: var(--ui-text-tertiary); font-size: 12px; }
  .dev summary { cursor: pointer; }
  .dev .login-input-group { margin-top: 12px; }
  @media (prefers-reduced-motion: reduce) { .login-container { animation: none; } }

</style>
</head>

import { clearBrowserAuth, readBrowserAuth, storeBrowserLogin } from './api/__entry/browser-auth.js';
(function () {

    n.hidden = !text;
    n.setAttribute('role', kind === 'err' ? 'alert' : 'status');

  }

  async function postJSON(url, body) {
    var r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' });
    var data = null; try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((data && (data.error || data.msg)) || ('HTTP ' + r.status));
    if (data && data.code !== undefined && data.code !== 0 && data.code !== '0') throw new Error(data.msg || ('上游错误 ' + data.code));
    return data;
  }

  // svg 元素没有 hidden 属性可赋值，统一改 hidden 这个 HTML 属性
  function show(id, visible) { $(id).toggleAttribute('hidden', !visible); }

  // 图形验证码按钮里三选一：图片 / 加载中 / 加载失败点了重试
  function captchaState(state) {
    show('captchaImg', state === 'image');
    show('captchaSpin', state === 'loading');
    show('captchaRetry', state === 'retry');
  }

  async function refreshCaptcha() {
    captchaState('loading');
    $('captchaCode').value = '';
    captchaId = '';
    updateControls();
    try {
      var r = await fetch(api('/captcha'), { credentials: 'same-origin' });
      var data = null; try { data = await r.json(); } catch (e) {}
      if (!r.ok || !data) throw new Error((data && (data.error || data.msg)) || ('HTTP ' + r.status));
      if (data.code !== undefined && data.code !== 0 && data.code !== '0') throw new Error(data.msg || ('上游错误 ' + data.code));
      var d = data.data || data;
      var img = d.b64s || '';
      if (!img) throw new Error('上游没有返回图片');
      captchaId = d.captchaId || '';
      $('captchaImg').src = img.indexOf('data:') === 0 ? img : 'data:image/png;base64,' + img;
      captchaState('image');
      if (captchaFailed) { captchaFailed = false; notice(''); }
    } catch (e) {
      captchaId = '';
      captchaFailed = true;
      captchaState('retry');
      notice('图形验证码获取失败，请点击刷新图片重试。', 'err');
    } finally {
      updateControls();
    }
  }

  function loginBusy(busy) {
    pending = busy;
    updateControls();
    show('loginSpin', busy);
    show('loginText', !busy);
  }

  $('captchaBtn').addEventListener('click', refreshCaptcha);
  digitsOnly($('phone'));
  digitsOnly($('smsCode'));
  $('captchaCode').addEventListener('input', function () { notice(''); });

  $('sendBtn').addEventListener('click', async function () {
    if (pending || smsPending || seconds > 0) return;
    var phone = $('phone').value.trim();
    var captchaCode = $('captchaCode').value.trim();
    if (!PHONE_RE.test(phone)) return notice('请输入以 1 开头的 11 位手机号。', 'err');
    if (!captchaCode || !captchaId) return notice('请输入图形验证码（最多 6 位）。', 'err');
    try {
      smsPending = true; updateControls(); notice('');
      await postJSON(api('/send-code'), { phone: phone, captchaCode: captchaCode, captchaId: captchaId });
      seconds = 60;
      var t = setInterval(function () { seconds--; updateControls(); if (seconds <= 0) clearInterval(t); }, 1000);
      notice('验证码已发送，请查看手机短信。', 'info');
    } catch (e) { notice('发送失败：' + e.message, 'err'); void refreshCaptcha(); }
    finally { smsPending = false; updateControls(); }
  });

  $('sms').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (pending || smsPending) return;
    var phone = $('phone').value.trim();
    var smsCode = $('smsCode').value.trim();
    if (!PHONE_RE.test(phone)) return notice('请输入以 1 开头的 11 位手机号。', 'err');
    if (!/^\d{6}$/.test(smsCode)) return notice('请输入 6 位数字短信验证码。', 'err');
    try {
      loginBusy(true); notice('');
      var data = await postJSON(api('/login'), { phone: phone, smsCode: smsCode });
      storeBrowserLogin(apiBase, data);
      notice(data.has_key ? '登录成功，正在准备你的工作空间…' : '登录成功（该账号没有可用套餐 key，模型将不可用）', 'info');
      location.href = data.redirect || (base + '/');
    } catch (e) { loginBusy(false); notice('登录失败：' + e.message, 'err'); }
  });

  $('devBtn').addEventListener('click', async function () {
    try {
      notice('开发模式登录中…', 'info');
      var data = await postJSON(api('/dev-login'), { user: $('devUser').value.trim() });
      storeBrowserLogin(apiBase, data);
      location.href = data.redirect || (base + '/');
    } catch (e) { notice('失败：' + e.message, 'err'); }
  });

  fetch(api('/config'), { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (c) {
    if (c && c.dev) { $('devBox').hidden = false; $('devBox').open = true; }
  }).catch(function () {});
  refreshCaptcha();
})();
</script>
</body>
</html>
