  [hidden] { display: none !important; }
  html, body { margin: 0; background: #06090f; }

  /* 左栏：宽屏才显示 */
  .intro { position: relative; display: none; flex: 1; flex-direction: column; justify-content: space-between; padding: 56px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: .08em; }
  .brand .mark { width: 36px; height: 36px; }
  .pitch { max-width: 576px; padding-bottom: 40px; }
  .eyebrow { margin: 0; font-size: 12px; line-height: 16px; font-weight: 500; color: rgba(83, 234, 253, .8); }
  .pitch .eyebrow { margin-bottom: 20px; letter-spacing: .3em; }
  h1 { margin: 0; font-size: 48px; line-height: 1.16; font-weight: 600; }
  h1 span { color: rgba(255, 255, 255, .45); }
  .desc { max-width: 448px; margin: 28px 0 0; font-size: 14px; line-height: 28px; color: rgba(255, 255, 255, .48); }
  .foot { margin: 0; font-size: 11px; letter-spacing: .05em; color: rgba(255, 255, 255, .25); }

  /* 右侧：登录卡片 */
  .side { position: relative; display: flex; width: 100%; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 410px; padding: 32px; border: 1px solid rgba(255, 255, 255, .1); border-radius: 6.4px; background: rgba(255, 255, 255, .055); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .4); -webkit-backdrop-filter: blur(40px); backdrop-filter: blur(40px); }
  .card > .mark { width: 44px; height: 44px; margin-bottom: 36.5px; }
  .card .eyebrow { letter-spacing: .24em; }
  h2 { margin: 12px 0 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.025em; }
  .sub { margin: 8px 0 0; font-size: 14px; line-height: 20px; color: rgba(255, 255, 255, .42); }
  form { margin: 32px 0 0; }
  .field { display: block; margin-bottom: 16px; }
  .label { display: block; padding: 2px 0 1.5px; font-size: 12px; line-height: 16px; color: rgba(255, 255, 255, .55); }
  .row { display: flex; gap: 8px; }
  input { display: block; width: 100%; min-width: 0; height: 44px; padding: 6px 12px; border: 1px solid rgba(74, 132, 254, .04); border-radius: 2.5px; background: transparent; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .38); color: #fff; font: inherit; font-size: 14px; line-height: 20px; outline: none; transition: border-color .2s ease-out; }
  .row input { flex: 1; }
  input::placeholder { color: rgba(230, 237, 243, .54); }
  input:hover { border-color: rgba(74, 132, 254, .08); }
  input:focus { border-color: #4a84fe; box-shadow: none; }
  button { color: #fff; font: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  button:focus-visible { outline: 2px solid rgba(74, 132, 254, .7); outline-offset: 2px; }
  .icon { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon.sm { width: 14px; height: 14px; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .captcha { display: flex; flex-shrink: 0; align-items: center; justify-content: center; width: 112px; height: 44px; padding: 0; overflow: hidden; border: 1px solid rgba(255, 255, 255, .1); border-radius: 2px; background: rgba(255, 255, 255, .95); color: rgba(0, 0, 0, .5); }
  .captcha img { width: 100%; height: 100%; object-fit: contain; }
  .ghost { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; min-width: 112px; height: 44px; padding: 6px 12px; border: 0; border-radius: 2.5px; background: transparent; box-shadow: inset 0 0 0 1px rgba(116, 160, 251, .11); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
  .ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .06); }
  .notice { margin: 0 0 16px; padding: 8px 12px; border: 1px solid; border-radius: 2.4px; font-size: 12px; line-height: 16px; }
  .notice.err { border-color: rgba(255, 100, 103, .2); background: rgba(255, 100, 103, .1); color: #ffc9c9; }
  .notice.info { border-color: rgba(0, 211, 242, .2); background: rgba(0, 211, 242, .08); color: #a2f4fd; }
  .submit { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 44px; margin-top: 24px; padding: 6px 10px; border: 0; border-radius: 2.5px; background: linear-gradient(to right, #2b7fff, #00d3f2); font-size: 14px; line-height: 20px; font-weight: 500; }
  .submit:hover:not(:disabled) { opacity: .9; }
  /* 开发模式登录：入口开了 MT_DEV_LOGIN 才出现 */
  .dev { margin-top: 24px; font-size: 12px; line-height: 16px; color: rgba(255, 255, 255, .42); }
  .dev summary { cursor: pointer; }
  .dev .row { margin-top: 12px; }
  /* 企业模式（入口配了 MT_UNIWORK_SERVER）：选企业 / 按编号加入 / 拦截说明 */
  .optional { color: rgba(255, 255, 255, .3); }
  .choices { display: flex; flex-direction: column; gap: 8px; margin: 24px 0 0; }
  .choice { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 52px; padding: 8px 14px; border: 0; border-radius: 2.5px; background: rgba(255, 255, 255, .04); box-shadow: inset 0 0 0 1px rgba(116, 160, 251, .11); text-align: left; }
  .choice:hover:not(:disabled) { background: rgba(255, 255, 255, .08); }
  .choice small { color: rgba(255, 255, 255, .42); font-size: 12px; white-space: nowrap; }
  .join { margin-top: 24px; }
  .join .ghost { min-width: 88px; }
  .link { margin-top: 20px; padding: 0; border: 0; background: none; color: rgba(255, 255, 255, .55); font-size: 12px; }
  .link:hover { color: #fff; }
  .org { margin: 0 0 8px; font-size: 13px; color: rgba(83, 234, 253, .8); }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
  .actions .submit { margin-top: 0; }
  .actions .ghost { width: 100%; }
  .meta { margin: 12px 0 0; font-size: 12px; color: rgba(255, 255, 255, .3); }

  @media (min-width: 640px) { .card { padding: 40px; } }
  @media (min-width: 1024px) { .intro { display: flex; } .side { width: 46%; } .card > .mark { display: none; } }
  @media (max-width: 374px) { .side { padding: 16px; } .card { padding: 24px; } }
</style>
</head>
<body>
<main>
  <div class="glow"></div>
  <div class="grid"></div>

  <section class="intro">
    <div class="brand"><span class="mark"></span>元景数字员工</div>
    <div class="pitch">
      <p class="eyebrow">INTELLIGENT WORKSPACE</p>
      <h1>让工作流动起来，<span>让智能触手可及。</span></h1>
      <p class="desc">一个账户连接你的智能助手、技能与个人资料库，跨设备延续每一次协作。</p>
    </div>
    <p class="foot">SECURE · CONNECTED · PERSONAL</p>
  </section>

  <section class="side">
    <div class="card">
      <span class="mark"></span>
      <div id="loginView">
      <p class="eyebrow">WELCOME</p>
      <h2>登录你的工作空间</h2>
      <p class="sub" id="loginSub">使用元景 MaaS 手机号继续</p>

      <form id="sms" novalidate>
        <label class="field">
          <span class="label">手机号</span>
          <input id="phone" autocomplete="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号">
        </label>
        <label class="field">
          <span class="label">图形验证码</span>
          <span class="row">
            <input id="captchaCode" autocomplete="off" maxlength="6" placeholder="请输入验证码">
            <button type="button" class="captcha" id="captchaBtn" aria-label="刷新验证码" title="点击刷新">
              <img id="captchaImg" alt="图形验证码" hidden>
              <svg class="icon spin" id="captchaSpin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
              <svg class="icon" id="captchaRetry" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>
            </button>
          </span>
        </label>
        <label class="field">
          <span class="label">短信验证码</span>
          <span class="row">
            <input id="smsCode" autocomplete="one-time-code" inputmode="numeric" maxlength="6" placeholder="请输入短信验证码">
            <button type="button" class="ghost" id="sendBtn">获取验证码</button>
          </span>
        </label>
        <label class="field" id="tenantCodeField" hidden>
          <span class="label">企业编号 <span class="optional">（选填，只属于一个企业时不用填）</span></span>
          <input id="tenantCode" autocomplete="organization" maxlength="32" placeholder="例如 T100001">
        </label>
        <p class="notice" id="notice" aria-live="polite" hidden></p>
        <button type="submit" class="submit" id="loginBtn">
          <svg class="icon" id="loginIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6"/><path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"/><path d="M8 11v-4a4 4 0 1 1 8 0v4"/></svg>
          <svg class="icon sm spin" id="loginSpin" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M12 3a9 9 0 1 0 9 9"/></svg>
          <span id="loginText">安全登录</span>
        </button>
      </form>

      <details class="dev" id="devBox" hidden>
        <summary>开发模式登录（生产环境不会出现）</summary>
        <span class="row">
          <input id="devUser" aria-label="任意用户名" placeholder="任意用户名，例如 alice">
          <button type="button" class="ghost" id="devBtn">直接进入</button>
        </span>
      </details>
      </div>

      <!-- 企业模式：登录后还要选企业，或这个手机号还没加入企业 -->
      <section class="panel" id="tenantView" hidden>
        <p class="eyebrow">ENTERPRISE</p>
        <h2 id="tenantTitle">选择企业</h2>
        <p class="sub" id="tenantSub"></p>
        <div class="choices" id="tenantList"></div>
        <div class="join">
          <span class="label" id="joinLabel">企业编号</span>
          <span class="row">
            <input id="joinCode" maxlength="32" placeholder="填写企业管理员给你的企业编号">
            <button type="button" class="ghost" id="joinBtn">加入</button>
          </span>
        </div>
        <p class="notice" id="tenantNotice" aria-live="polite" hidden style="margin-top: 16px"></p>
        <button type="button" class="link" id="tenantBack">← 返回登录</button>
      </section>

      <!-- 企业模式：登录了，但企业暂时不让用（待审批、停用、没席位……） -->
      <section class="panel" id="gateView" hidden>
        <p class="eyebrow">ENTERPRISE</p>
        <p class="org" id="gateOrg" hidden></p>
        <h2 id="gateTitle"></h2>
        <p class="sub" id="gateBody"></p>
        <p class="meta" id="gateMeta" hidden></p>
        <p class="notice err" id="gateNotice" aria-live="polite" hidden style="margin-top: 16px"></p>
        <div class="actions">
          <button type="button" class="submit" id="gateCheck">重新检查</button>
          <button type="button" class="ghost" id="gateLogout">退出登录</button>
        </div>
      </section>
    </div>
  </section>
</main>
<script>
(function () {
  var base = location.pathname.replace(/\/login\/?$/, '');
  var api = function (p) { return base + '/__entry' + p; };
  var $ = function (id) { return document.getElementById(id); };
  var PHONE_RE = /^1[3-9]\d{9}$/;
  var SPINNER = '<svg class="icon sm spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>';
  var captchaId = '';
  var captchaFailed = false;

  var enterpriseMode = false;
  var pending = '';      // 企业模式选企业时，入口封好的登录票据
  var gateTimer = 0;     // 拦截页每 15 秒复查一次

  // 提示条：kind 为 'err' 是红色报错、'info' 是普通提示；text 为空就收起。id 默认是登录表单里那一条
  function notice(text, kind, id) {
    var n = $(id || 'notice');
    n.textContent = text || '';
    n.className = 'notice ' + (kind || '');
    n.hidden = !text;
  }

  // 卡片里三选一：登录表单 / 选企业 / 拦截说明
  function view(name) {
    $('loginView').hidden = name !== 'login';
    $('tenantView').hidden = name !== 'tenant';
    $('gateView').hidden = name !== 'gate';
    if (name !== 'gate' && gateTimer) { clearInterval(gateTimer); gateTimer = 0; }
  }

  function digitsOnly(input) {
    input.addEventListener('input', function () {
      var value = input.value.replace(/\D/g, '');
      if (value !== input.value) input.value = value;
    });
  }

  async function postJSON(url, body) {
    var r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' });
    var data = null; try { data = await r.json(); } catch (e) {}
    if (!r.ok) {
      var err = new Error((data && (data.error || data.msg)) || ('HTTP ' + r.status));
      err.status = r.status;
      throw err;
    }
    if (data && data.code !== undefined && data.code !== 0 && data.code !== '0') throw new Error(data.msg || ('上游错误 ' + data.code));
    return data;
  }

  // svg 元素没有 hidden 属性可赋值，统一改 hidden 这个 HTML 属性
  function show(id, visible) { $(id).toggleAttribute('hidden', !visible); }

  // 图形验证码按钮里三选一：图片 / 加载中 / 加载失败点了重试
  function captchaState(state) {
    show('captchaImg', state === 'image');
    show('captchaSpin', state === 'loading');
    show('captchaRetry', state === 'retry');
  }

  async function refreshCaptcha() {
    captchaState('loading');
    $('captchaCode').value = '';
    try {
      var r = await fetch(api('/captcha'), { credentials: 'same-origin' });
      var data = null; try { data = await r.json(); } catch (e) {}
      if (!r.ok || !data) throw new Error((data && (data.error || data.msg)) || ('HTTP ' + r.status));
      if (data.code !== undefined && data.code !== 0 && data.code !== '0') throw new Error(data.msg || ('上游错误 ' + data.code));
      var d = data.data || data;
      var img = d.b64s || '';
      if (!img) throw new Error('上游没有返回图片');
      captchaId = d.captchaId || '';
      $('captchaImg').src = img.indexOf('data:') === 0 ? img : 'data:image/png;base64,' + img;
      captchaState('image');
      if (captchaFailed) { captchaFailed = false; notice(''); }
    } catch (e) {
      captchaId = '';
      captchaFailed = true;
      captchaState('retry');
      notice('获取图形验证码失败：' + e.message, 'err');
    }
  }

  function loginBusy(busy) {
    $('loginBtn').disabled = busy;
    show('loginIcon', !busy);
    show('loginSpin', busy);
    $('loginText').textContent = busy ? '正在登录…' : '安全登录';
  }

  $('captchaBtn').addEventListener('click', refreshCaptcha);
  digitsOnly($('phone'));
  digitsOnly($('smsCode'));

  $('sendBtn').addEventListener('click', async function () {
    var btn = $('sendBtn');
    var phone = $('phone').value.trim();
    var captchaCode = $('captchaCode').value.trim();
    if (!PHONE_RE.test(phone)) return notice('请输入有效的中国大陆手机号', 'err');
    if (!captchaCode || !captchaId) return notice('请先输入图形验证码', 'err');
    try {
      btn.disabled = true; btn.innerHTML = SPINNER; notice('');
      await postJSON(api('/send-code'), { phone: phone, captchaCode: captchaCode, captchaId: captchaId });
      var left = 60; btn.textContent = left + 's';
      var t = setInterval(function () { left--; btn.textContent = left + 's'; if (left <= 0) { clearInterval(t); btn.textContent = '获取验证码'; btn.disabled = false; } }, 1000);
      notice('验证码已发送', 'info');
    } catch (e) { btn.disabled = false; btn.textContent = '获取验证码'; notice('发送失败：' + e.message, 'err'); refreshCaptcha(); }
  });

  $('sms').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var phone = $('phone').value.trim();
    var smsCode = $('smsCode').value.trim();
    // 企业模式只要求 11 位 1 开头：平台的免短信测试号（100…）也要能登，号码真不真由平台和元景判断
    if (!(enterpriseMode ? /^1\d{10}$/ : PHONE_RE).test(phone)) return notice('请输入有效的中国大陆手机号', 'err');
    if (!smsCode) return notice('请输入短信验证码', 'err');
    var body = { phone: phone, smsCode: smsCode };
    if (enterpriseMode && $('tenantCode').value.trim()) body.tenantCode = $('tenantCode').value.trim();
    try {
      loginBusy(true); notice('');
      var data = await postJSON(api('/login'), body);
      if (data.enterprise && !data.ok) { loginBusy(false); return showTenants(data.enterprise); }
      if (data.enterprise && !data.enterprise.allowed) { loginBusy(false); return showGate(data.enterprise); }
      notice(data.has_key ? '登录成功，正在准备你的工作空间…' : '登录成功（该账号没有可用套餐 key，模型将不可用）', 'info');
      location.href = data.redirect || (base + '/');
    } catch (e) { loginBusy(false); notice('登录失败：' + e.message, 'err'); }
  });

  // ---- 企业模式 ----

  var TENANT_COPY = {
    choose_tenant: ['选择企业', '这个手机号属于多个企业，选一个进入。', '或者填写企业编号，加入其他企业'],
    tenant_required: ['加入企业', '这个手机号还没有加入任何企业。填写企业管理员给你的企业编号，提交加入申请。', '企业编号'],
    tenant_not_found: ['企业编号不存在', '', '企业编号']
  };
  var MEMBER_STATUS = { '在职': '', '待审核': '待审批', '已停用': '已停用', '已拒绝': '未通过' };

  function showTenants(ent) {
    pending = ent.pending || '';
    var copy = TENANT_COPY[ent.status] || TENANT_COPY.tenant_required;
    $('tenantTitle').textContent = copy[0];
    $('tenantSub').textContent = ent.status === 'tenant_not_found'
      ? '找不到企业编号「' + (ent.tenantCode || '') + '」，请向企业管理员确认后重新填写。' : copy[1];
    $('joinLabel').textContent = copy[2];
    $('joinCode').value = '';
    var list = $('tenantList');
    list.textContent = '';
    (ent.tenants || []).forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'choice';
      var name = document.createElement('span');
      name.textContent = (t.tenantName || t.tenantCode) + (t.tenantCode ? '（' + t.tenantCode + '）' : '');
      var state = document.createElement('small');
      state.textContent = MEMBER_STATUS[t.memberStatus] !== undefined ? MEMBER_STATUS[t.memberStatus] : (t.memberStatus || '');
      b.appendChild(name); b.appendChild(state);
      b.addEventListener('click', function () { selectTenant({ tenantId: t.tenantId }); });
      list.appendChild(b);
    });
    list.hidden = !(ent.tenants || []).length;
    notice('', '', 'tenantNotice');
    view('tenant');
  }

  async function selectTenant(choice) {
    var buttons = document.querySelectorAll('#tenantView button');
    buttons.forEach(function (b) { b.disabled = true; });
    notice('正在进入…', 'info', 'tenantNotice');
    try {
      var data = await postJSON(api('/select-tenant'), Object.assign({ pending: pending }, choice));
      if (data.enterprise && !data.enterprise.allowed) return showGate(data.enterprise);
      location.href = data.redirect || (base + '/');
    } catch (e) {
      if (e.status === 401) { view('login'); notice(e.message, 'err'); refreshCaptcha(); return; }
      notice(e.message, 'err', 'tenantNotice');   // 编号不对：票据还能用，换个编号再试
    } finally { buttons.forEach(function (b) { b.disabled = false; }); }
  }

  $('joinBtn').addEventListener('click', function () {
    var code = $('joinCode').value.trim();
    if (!code) return notice('请填写企业编号', 'err', 'tenantNotice');
    selectTenant({ tenantCode: code });
  });
  $('tenantBack').addEventListener('click', function () { view('login'); refreshCaptcha(); });

  // 拦截说明：文案照桌面端企业版的 EnterpriseGate.tsx
  var GATE_COPY = {
    pending: ['加入申请已提交', '管理员审批通过并分配席位后即可使用，本页会自动刷新。'],
    not_member: ['加入申请已提交', '管理员审批通过并分配席位后即可使用，本页会自动刷新。'],
    rejected: ['加入申请未通过', '如有疑问请联系企业管理员。重新登录会再次提交申请。'],
    disabled: ['账号已被停用', '你的企业账号已被管理员停用，请联系企业管理员。'],
    no_seat: ['尚未分配席位', '你已是企业成员，但还没有分配客户端席位。管理员分配后即可使用。'],
    tenant_suspended: ['企业服务已停用', '企业的 UNIWORK 服务已停用，请联系企业管理员。'],
    unbound: ['企业登录已失效', '设备与企业的绑定已失效（可能已在别处退出登录，或被管理员重置），请重新登录。']
  };

  function showGate(ent) {
    if (ent.allowed) { location.href = base + '/'; return; }
    var status = GATE_COPY[ent.status] ? ent.status : 'unbound';
    $('gateTitle').textContent = GATE_COPY[status][0];
    $('gateBody').textContent = GATE_COPY[status][1];
    $('gateOrg').textContent = ent.tenantName || '';
    $('gateOrg').hidden = !ent.tenantName;
    $('gateMeta').textContent = ent.memberName ? '成员 ' + ent.memberName : '';
    $('gateMeta').hidden = !ent.memberName;
    $('gateCheck').hidden = status === 'unbound';
    $('gateLogout').textContent = status === 'unbound' ? '重新登录' : '退出登录';
    $('gateLogout').className = status === 'unbound' ? 'submit' : 'ghost';
    notice('', '', 'gateNotice');
    view('gate');
    if (status !== 'unbound' && !gateTimer) gateTimer = setInterval(function () { recheck(false); }, 15000);
  }

  // 问入口（入口再问平台）现在能不能用：放行了就进工作空间
  async function recheck(manual) {
    var btn = $('gateCheck');
    if (manual) { btn.disabled = true; btn.textContent = '正在检查…'; }
    try {
      var r = await fetch(api('/enterprise'), { credentials: 'same-origin' });
      var data = null; try { data = await r.json(); } catch (e) {}
      if (r.status === 401) { view('login'); return; }
      if (!r.ok || !data) throw new Error((data && data.error) || ('HTTP ' + r.status));
      showGate(data);
    } catch (e) { notice('检查失败：' + e.message, 'err', 'gateNotice'); }
    finally { if (manual) { btn.disabled = false; btn.textContent = '重新检查'; } }
  }

  $('gateCheck').addEventListener('click', function () { recheck(true); });
  $('gateLogout').addEventListener('click', async function () {
    try { await postJSON(api('/logout'), {}); } catch (e) {}
    view('login'); notice(''); refreshCaptcha();
  });

  $('devBtn').addEventListener('click', async function () {
    try {
      notice('开发模式登录中…', 'info');
      var data = await postJSON(api('/dev-login'), { user: $('devUser').value.trim() });
      location.href = data.redirect || (base + '/');
    } catch (e) { notice('失败：' + e.message, 'err'); }
  });

  fetch(api('/config'), { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (c) {
    if (c && c.dev) { $('devBox').hidden = false; $('devBox').open = true; }
    if (c && c.enterprise) {
      enterpriseMode = true;
      $('tenantCodeField').hidden = false;
      $('loginSub').textContent = '使用元景 MaaS 手机号登录企业工作空间';
      // 已登录但被企业拦住的人会被送到这里：直接显示拦截说明（没登录是 401，留在登录表单）
      return fetch(api('/enterprise'), { credentials: 'same-origin' }).then(function (r) {
        return r.ok ? r.json().then(showGate) : null;
      });
    }
  }).catch(function () {});
  refreshCaptcha();
})();
</script>
</body>
</html>
