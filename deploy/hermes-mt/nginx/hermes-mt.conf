# Hermes 多租户：Nginx 只做三件事——出静态 SPA、把 ws/REST 转给入口、未登录的静态请求踢去登录页。
# 与 .7 单用户版的差异：两处 proxy_pass 指向入口（不再写死 token），静态目录加 auth_request。
server {
    listen 8081;
    server_name _;
    client_max_body_size 50m;
    absolute_redirect off;   # 302 用相对路径，宿主端口和容器端口不同也不会带错端口

    location = / { return 302 /hermes/; }
    location = /hermes { return 301 /hermes/; }

    # 给 auth_request 用的内部子请求：入口按 cookie 判断已登录与否
    location = /__entry_auth {
        internal;
        proxy_pass http://entry:9400/hermes/__entry/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # 登录页与入口自己的接口，不需要登录态
    location = /hermes/logout {
        proxy_pass http://entry:9400;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;   # 带端口：入口拿它和 Origin 比对
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /hermes/login {
        proxy_pass http://entry:9400;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;   # 带端口：入口拿它和 Origin 比对
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 平台调用云端运行智能体（docs/企业版对接/15）：事件流不能缓冲，一次运行可能跑几十分钟；
    # 准备运行环境最长约 2 分钟。来源地址由入口按 MT_UNIWORK_SERVICE_ALLOW 检查（这里写 X-Real-IP）。
    location ^~ /hermes/__entry/service/ {
        client_max_body_size 1m;
        proxy_pass http://entry:9400;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /hermes/__entry/ {
        proxy_pass http://entry:9400;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;   # 带端口：入口拿它和 Origin 比对
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket：入口验 cookie、选容器、注 token
    location = /hermes/api/ws {
        proxy_pass http://entry:9400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;   # 带端口：入口拿它和 Origin 比对
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 实例里的命令行（右侧终端面板，WebSocket）：入口验 cookie 和来源、注令牌，转到实例里的转发器。
    # 精确匹配优先于下面 /hermes/__hermes_backend/ 的前缀匹配；那条没有 Upgrade 头，WebSocket 过不去。
    location = /hermes/__hermes_backend/__mt_user/terminal {
        proxy_pass http://entry:9400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;   # 带端口：入口拿它和 Origin 比对
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # REST：同上
    location ^~ /hermes/__hermes_backend/ {
        proxy_pass http://entry:9400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;   # 带端口：入口拿它和 Origin 比对
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 带哈希文件名的静态资源：可以长期缓存（内容变了文件名就变）
    location ^~ /hermes/assets/ {
        auth_request /__entry_auth;
        error_page 401 = @to_login;
        alias /usr/share/nginx/html/hermes/assets/;
        # 只用 add_header 发一个头：再配 `expires` 会让响应带两个 Cache-Control
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 静态 SPA：未登录 → 302 登录页。
    # 登录的是谁、退出，由页面状态栏的账号那一项显示（垫片的 getMaasAccount 读 /hermes/__entry/me）。
    location ^~ /hermes/ {
        auth_request /__entry_auth;
        error_page 401 = @to_login;
        alias /usr/share/nginx/html/hermes/;
        try_files $uri $uri/ /hermes/index.html;
        # ★ index.html 绝不能进浏览器缓存：退出登录后再访问，浏览器会直接拿缓存里的
        #   外壳渲染（实测 200 fromCache=true，根本不问服务器），看起来像没退成功——
        #   数据其实一条都拿不到。带哈希名的 assets 不受影响，见上面的 location。
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
    location @to_login { return 302 /hermes/login; }
}

# 平台调用云端运行智能体专用的监听（docs/企业版对接/15）：只转服务接口这一组路径，别的一律 404，网页入口不在这里。
# 对外映射到和平台同网段的地址（MT_SERVICE_HTTP_PORT；.7 上是 192.168.0.7:18081：平台在 0.x 网段，
# 访问 192.168.2.71 时 .7 的回包从 eth0 走，来回路径不一致会被丢）。入口还要验密钥和来源地址。
server {
    listen 8082;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    location ^~ /hermes/__entry/service/ {
        proxy_pass http://entry:9400;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / { return 404; }
}
