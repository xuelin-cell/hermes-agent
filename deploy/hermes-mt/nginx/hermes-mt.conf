# Hermes 多租户：Nginx 只做三件事——出静态 SPA、把 ws/REST 转给入口、未登录的静态请求踢去登录页。
# 与 .7 单用户版的差异：两处 proxy_pass 指向入口（不再写死 token），静态目录加 auth_request。
server {
    listen 8081;
    server_name _;
    client_max_body_size 50m;
    absolute_redirect off;   # 302 用相对路径，宿主端口和容器端口不同也不会带错端口

    location = / { return 302 /hermes/; }
    location = /hermes { return 301 /hermes/; }

    # 给 auth_request 用的内部子请求：入口按 cookie 判断已登录与否
    location = /__entry_auth {
        internal;
        proxy_pass http://entry:9400/hermes/__entry/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # 登录页与入口自己的接口，不需要登录态
    location = /hermes/logout {
        proxy_pass http://entry:9400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /hermes/login {
        proxy_pass http://entry:9400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /hermes/__entry/ {
        proxy_pass http://entry:9400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket：入口验 cookie、选容器、注 token
    location = /hermes/api/ws {
        proxy_pass http://entry:9400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # REST：同上
    location ^~ /hermes/__hermes_backend/ {
        proxy_pass http://entry:9400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 带哈希文件名的静态资源：可以长期缓存（内容变了文件名就变）
    location ^~ /hermes/assets/ {
        auth_request /__entry_auth;
        error_page 401 = @to_login;
        alias /usr/share/nginx/html/hermes/assets/;
        # 只用 add_header 发一个头：再配 `expires` 会让响应带两个 Cache-Control
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 静态 SPA：未登录 → 302 登录页
    #
    # sub_filter 往 index.html 里插一行 <script>，给 SPA 贴一个「谁在登录 + 退出」的角标。
    # ★ 前端源码和构建产物一个字节不动——SPA 是 hermes 原生的，它不知道入口的存在，
    #   界面上不会有任何跟我们登录体系相关的元素，只能从部署层贴。
    # sub_filter 只对未压缩的响应生效，所以这里显式 gzip off（HTML 很小，无所谓）。
    location ^~ /hermes/ {
        auth_request /__entry_auth;
        error_page 401 = @to_login;
        alias /usr/share/nginx/html/hermes/;
        try_files $uri $uri/ /hermes/index.html;
        gzip off;
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</body>' '<script src="/hermes/__entry/badge.js" defer></script></body>';
        # ★ index.html 绝不能进浏览器缓存：退出登录后再访问，浏览器会直接拿缓存里的
        #   外壳渲染（实测 200 fromCache=true，根本不问服务器），看起来像没退成功——
        #   数据其实一条都拿不到。带哈希名的 assets 不受影响，见上面的 location。
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
    location @to_login { return 302 /hermes/login; }
}
