# 独立部署，仅用于 Cube 后端；通过 deploy-isolated.sh 使用，不自动加载 compose.override.yaml。
services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: ${MT_DEPLOY_PROJECT:?required}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MT_POSTGRES_DB:-hermes_entry}
      POSTGRES_USER: ${MT_POSTGRES_USER:-hermes_entry}
      POSTGRES_PASSWORD: ${MT_POSTGRES_PASSWORD:-hermes-local-dev}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - isolated

  entry:
    build:
      context: ../..
      dockerfile: deploy/hermes-mt/entry/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: ${MT_DEPLOY_PROJECT:?required}-entry:dev
    container_name: ${MT_DEPLOY_PROJECT:?required}-entry
    restart: unless-stopped
    env_file:
      - path: ./entry.env
        required: false
    environment:
      MT_SELF_CONTAINER: ${MT_DEPLOY_PROJECT:?required}-entry
      MT_DOCKER_SOCK: /var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9400/hermes/__entry/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    networks:
      - isolated

  channels:
    profiles: [messaging]
    build:
      context: ../..
      dockerfile: deploy/hermes-mt/channels/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: ${MT_DEPLOY_PROJECT:?required}-channels:dev
    container_name: ${MT_DEPLOY_PROJECT:?required}-channels
    restart: unless-stopped
    env_file: ./entry.env
    depends_on:
      entry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9500/health', timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 3
    networks:
      - isolated

  nginx:
    build:
      context: ./nginx
    image: ${MT_DEPLOY_PROJECT:?required}-nginx:dev
    container_name: ${MT_DEPLOY_PROJECT:?required}-nginx
    restart: unless-stopped
    ports:
      - "${MT_HTTP_PORT:?required}:8081"
    depends_on:
      entry:
        condition: service_healthy
    networks:
      - isolated

volumes:
  postgres-data:
    name: ${MT_DEPLOY_PROJECT:?required}-postgres

networks:
  isolated:
    name: ${MT_DEPLOY_PROJECT:?required}
