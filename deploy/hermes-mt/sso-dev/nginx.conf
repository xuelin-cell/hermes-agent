# 本机联调用的网关 nginx。/agents/ 这一段和 docs/企业版对接/37 第 1 节给登录系统的参考配置相同，只是上游换成本机的：
# 企业版、静态页 → 本机企业版栈（127.0.0.1:18091），个人版 → 本机个人版栈（127.0.0.1:18092），
# /login/ 和 /app/gateway/ → 本机的假网关 gateway.py（18096）。容器里经 host.docker.internal 访问宿主机。
worker_processes 1;
events { worker_connections 1024; }

http {
    map $sso_type $agents_upstream {
        personal   agents_personal;
        enterprise agents_enterprise;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream agents_enterprise { server host.docker.internal:18091; }
    upstream agents_personal   { server host.docker.internal:18092; }
    upstream agents_static     { server host.docker.internal:18091; }
    upstream sso_gateway       { server host.docker.internal:18096; }

    server {
        listen 8080;
        absolute_redirect off;

        # ---- 网关自己的部分（假的）----
        location = /auth {
            internal;
            proxy_pass http://sso_gateway/app/gateway/access/management/api/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
        }
        location @sso_401 { default_type application/json; return 401 '{"code":401,"error":"LOGIN_REQUIRED","data":null}'; }
        location @sso_403 { default_type application/json; return 403 '{"code":403,"error":"ACCOUNT_NOT_ALLOWED","data":null}'; }

        location = /login { proxy_pass http://sso_gateway; }
        location ^~ /login/ { proxy_pass http://sso_gateway; proxy_set_header Host $http_host; }
        # 浏览器入口挡住内部接口，12.4 只能从内网直接调（38 号第 3 节）
        location ^~ /app/gateway/sso/internal/ { return 404; }
        location ^~ /app/gateway/ { proxy_pass http://sso_gateway; proxy_set_header Host $http_host; }

        # ---- /agents/：和 37 号的参考配置相同，只有一处要改：Host 用 $http_host（带端口）。$host 不带端口，
        #      站点不在默认端口上时，入口拿 Origin 比对主机会对不上，写请求和 WebSocket 全被当成跨站拒掉 ----
        location ^~ /agents/api/ {
            auth_request /auth;
            auth_request_set $sso_uid    $upstream_http_x_uid;
            auth_request_set $sso_type   $upstream_http_x_account_type;
            auth_request_set $sso_tenant $upstream_http_x_tenant_id;
            auth_request_set $sso_sid    $upstream_http_x_sid;
            auth_request_set $sso_error  $upstream_http_x_auth_error;

            proxy_set_header X-Uid          $sso_uid;
            proxy_set_header X-Account-Type $sso_type;
            proxy_set_header X-Tenant-Id    $sso_tenant;
            proxy_set_header X-Sid          $sso_sid;

            proxy_set_header Host              $http_host;   # 带端口：入口拿它和浏览器的 Origin 比对
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;

            client_max_body_size 50m;
            proxy_request_buffering off;
            proxy_buffering off;

            error_page 401 = @sso_401;
            error_page 403 = @sso_403;
            proxy_pass http://$agents_upstream;
        }

        location ^~ /agents/ {
            proxy_set_header X-Uid          "";
            proxy_set_header X-Account-Type "";
            proxy_set_header X-Tenant-Id    "";
            proxy_set_header X-Sid          "";
            proxy_set_header Host $http_host;
            proxy_pass http://agents_static;
        }
        location = /agents { return 301 /agents/$is_args$args; }
    }
}
