name: security-guardrail
version: "0.2.0"
description: "Guardrail engine and detection APIs; phase-one write_file hook retained until execution adapters are connected."
python_dependencies:
  - "pydantic>=2,<3"
provides_hooks:
  - pre_tool_call
config_schema:
  protected_directory:
    type: str
    default: ""
    description: "Absolute local directory protected from write_file (including descendants)."
    required: true
