name: desktop-deliverables
version: "0.2.0"
description: "Deliver local output previews and load images for vision-capable desktop models; preserve text-model and other tool routes."
provides_tools:
  - desktop_read_image
hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - transform_llm_output
  - subagent_start
  - on_session_end
